<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OMFS Staff Portal</title>
  
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1f4fd8">

  <script>
    // Prevent Flash of Unstyled Content (FOUC) for Dark Mode
    const savedTheme = localStorage.getItem('OMFS_THEME');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

  <style>
    :root {
      /* Light Mode Variables */
      --bg0: #f2f6ff;
      --bg1: #f7f9ff;
      --card: rgba(255, 255, 255, 0.80);
      --text: #0b1220;
      --muted: #5b667a;
      --muted2: #76829a;
      --border: rgba(15, 23, 42, 0.10);
      --border2: rgba(255, 255, 255, 0.55);
      --primary: #1f4fd8;
      --primaryDark: #163db3;
      --shadow1: 0 10px 30px rgba(2, 6, 23, 0.08);
      --shadow2: 0 14px 40px rgba(2, 6, 23, 0.10);
      --shadow3: 0 22px 70px rgba(2, 6, 23, 0.14);
      --radiusXL: 28px;
      --radius: 18px;
      --radiusSm: 14px;
      --glass: rgba(255, 255, 255, 0.72);
      --blur: 16px;
      --ring: rgba(31, 79, 216, 0.18);
      --ring2: rgba(139, 92, 246, 0.16);
      
      --body-grad-1: rgba(31,79,216,.22);
      --body-grad-2: rgba(139,92,246,.18);
      --body-grad-3: rgba(34,197,94,.12);
    }

    /* Manual Dark Mode Support */
    [data-theme="dark"] {
      --bg0: #0f172a;
      --bg1: #1e293b;
      --card: rgba(30, 41, 59, 0.75);
      --text: #f8fafc;
      --muted: #94a3b8;
      --muted2: #64748b;
      --border: rgba(255, 255, 255, 0.10);
      --border2: rgba(255, 255, 255, 0.15);
      --shadow1: 0 10px 30px rgba(0, 0, 0, 0.3);
      --shadow2: 0 14px 40px rgba(0, 0, 0, 0.4);
      --shadow3: 0 22px 70px rgba(0, 0, 0, 0.5);
      --glass: rgba(15, 23, 42, 0.72);
      
      --body-grad-1: rgba(31,79,216,.15);
      --body-grad-2: rgba(139,92,246,.12);
      --body-grad-3: rgba(34,197,94,.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 520px at 16% -10%, var(--body-grad-1), transparent 58%),
        radial-gradient(900px 520px at 92% 0%, var(--body-grad-2), transparent 60%),
        radial-gradient(900px 520px at 60% 112%, var(--body-grad-3), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.10), transparent 45%),
        radial-gradient(circle at 80% 0%, rgba(255,255,255,.05), transparent 50%);
      opacity: .45;
      mix-blend-mode: overlay;
      z-index: 0;
    }

    .wrap {
      max-width: 1140px;
      margin: 0 auto;
      padding: 18px;
      position: relative;
      z-index: 1;
    }

    .hero {
      position: relative;
      border-radius: var(--radiusXL);
      padding: 24px 18px;
      text-align: center;
      overflow: hidden;
      box-shadow: var(--shadow2);
      border: 1px solid var(--border2);
      background:
        radial-gradient(900px 260px at 20% 0%, rgba(255,255,255,.22), transparent 60%),
        linear-gradient(135deg, #1f4fd8, #163db3);
      color: #fff;
    }
    .hero::after {
      content: "";
      position: absolute; inset: -2px;
      background:
        radial-gradient(760px 200px at 10% -10%, rgba(255,255,255,.26), transparent 58%),
        radial-gradient(760px 220px at 90% 0%, rgba(255,255,255,.14), transparent 60%);
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .hero h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .5px;
      position: relative;
      z-index: 1;
    }
    .hero .sub {
      margin-top: 8px;
      font-size: 14px;
      opacity: .95;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }
    .hero .divider {
      width: 80px;
      height: 3px;
      margin: 16px auto 0 auto;
      background: rgba(255,255,255,.4);
      position: relative;
      z-index: 1;
      border-radius: 999px;
    }

    .toolbar {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .panel {
      background: var(--glass);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--border2);
      box-shadow: var(--shadow1);
      border-radius: var(--radius);
    }

    .search {
      padding: 8px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 52px;
      transition: box-shadow 0.2s ease;
    }
    .search:focus-within {
      box-shadow: 0 0 0 3px var(--ring), var(--shadow1);
      border-color: var(--primary);
    }

    .searchIcon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(31,79,216,.10);
      border: 1px solid rgba(31,79,216,.18);
      flex: 0 0 auto;
    }
    .search input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 15px;
      background: transparent;
      color: var(--text);
    }
    .search input::placeholder { color: var(--muted2); }

    .hint {
      font-size: 12px;
      color: var(--muted2);
      white-space: nowrap;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }

    .toolbarActions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .iconBtn {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      min-width: 52px;
      color: var(--text);
    }
    .iconBtn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primaryDark);
    }
    .iconBtn.primary:hover { filter: brightness(1.1); }

    .favBtn {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      min-height: 52px;
    }
    .favBtn .star { font-size: 18px; line-height: 1; color: #f59e0b; }
    .favBtn .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.2);
      color: var(--text);
      margin-left: 4px;
    }
    .favBtn[aria-pressed="true"] {
      background: rgba(31,79,216,.1);
      border-color: rgba(31,79,216,.3);
    }

    .chips {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
    }
    .chip {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.65);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      user-select: none;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    [data-theme="dark"] .chip { background: rgba(255,255,255,.2); }
    .chip:hover { background: rgba(31,79,216,.08); }
    .chip.active {
      background: rgba(31,79,216,.16);
      border-color: rgba(31,79,216,.4);
      color: var(--primaryDark);
      box-shadow: 0 4px 12px rgba(31,79,216,.14);
    }
    [data-theme="dark"] .chip.active { color: #93c5fd; background: rgba(59, 130, 246, 0.2); }

    .grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 720px){
      .toolbar{ grid-template-columns: 1fr; }
      .grid{ grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px){ .grid{ grid-template-columns: 1fr; } }

    .app {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 16px 16px 14px 16px;
      min-height: 140px;
      background: var(--card);
      border: 1px solid var(--border2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transform: translateZ(0);
      text-decoration: none;
      color: inherit;
    }
    .app::before {
      content: "";
      position: absolute; left: 0; top: 0; right: 0; height: 4px;
      background: var(--accent, var(--primary)); opacity: .96;
    }
    .app::after {
      content: ""; position: absolute; width: 150px; height: 150px;
      border-radius: 50%; right: -50px; bottom: -50px;
      background: var(--accent); opacity: 0.1; filter: blur(25px);
      pointer-events: none; transition: opacity 0.3s ease;
    }
    .app:hover::after { opacity: 0.2; }

    .app .top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; position: relative; z-index: 1;
    }
    .app h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.2; }
    .app p { margin: 8px 0 0 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--text); white-space: nowrap;
    }

    .openRow {
      margin-top: auto; display: flex; align-items: center;
      justify-content: space-between; gap: 10px; padding-top: 10px;
      position: relative; z-index: 1;
    }
    .openPill {
      font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: rgba(255, 255, 255, 0.5);
      color: var(--text); user-select: none; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 6px;
    }
    .openPill::after { content: "↗"; font-size: 14px; opacity: 0.7; }
    [data-theme="dark"] .openPill { background: rgba(0, 0, 0, 0.2); }
    .app:hover .openPill { background: var(--accent); color: #fff; border-color: transparent; }
    .app:hover .openPill::after { opacity: 1; }

    .rightTools { display: flex; align-items: center; gap: 10px; }
    .dot {
      width: 8px; height: 8px; border-radius: 999px; background: var(--accent, var(--primary));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); flex: 0 0 auto;
    }
    .favMini {
      font-size: 16px; line-height: 1; padding: 8px; border-radius: 12px;
      border: 1px solid var(--border); background: rgba(255,255,255,.5);
      color: var(--muted); user-select: none; display: flex;
      align-items: center; justify-content: center;
    }
    [data-theme="dark"] .favMini { background: rgba(0,0,0,.2); }
    .favMini.isFav { border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    .favMini:hover { transform: scale(1.1); }

    /* Modals & Empty States */
    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 60px 20px;
      background: var(--card); border-radius: var(--radius);
      border: 1px dashed var(--border);
    }
    .empty-state h3 { margin: 0 0 8px 0; color: var(--text); }
    .empty-state p { margin: 0; color: var(--muted); font-size: 14px; }
    .spinner {
      display: inline-block; width: 30px; height: 30px;
      border: 3px solid var(--border); border-radius: 50%;
      border-top-color: var(--primary); animation: spin 1s ease-in-out infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal Form UI */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 100; display: none; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; transition: opacity 0.3s ease;
    }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal-box {
      background: var(--bg0); border-radius: var(--radiusXL);
      padding: 30px; width: 100%; max-width: 500px;
      box-shadow: var(--shadow3); border: 1px solid var(--border2);
      transform: translateY(20px); transition: transform 0.3s ease;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-overlay.show .modal-box { transform: translateY(0); }
    .modal-box h2 { margin: 0 0 20px 0; font-size: 20px; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--text); }
    .form-control {
      width: 100%; padding: 12px; border-radius: 12px; font-size: 14px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-family: inherit; transition: border-color 0.2s;
    }
    .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
    
    .color-picker { display: flex; gap: 10px; margin-top: 8px; }
    .color-opt {
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.2s;
    }
    .color-opt:hover { transform: scale(1.1); }
    .color-opt.selected { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg0) inset; }

    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    .btn-text { padding: 10px 16px; font-weight: 600; color: var(--muted); cursor: pointer; }
    .btn-text:hover { color: var(--text); }
    .btn-submit {
      padding: 10px 24px; font-weight: 600; border-radius: 12px;
      background: var(--primary); color: white; cursor: pointer;
      box-shadow: 0 4px 12px rgba(31,79,216,.2); transition: all 0.2s;
    }
    .btn-submit:hover { background: var(--primaryDark); transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .btn {
      cursor: pointer; position: relative; z-index: 5;
      transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.18s ease, filter 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: var(--shadow3); }
    .btn:active { transform: translateY(0); filter: brightness(0.95); }
    button { font: inherit; appearance: none; border: none; background: transparent; padding: 0; }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="hero">
      <h1>Web App Portal</h1>
      <div class="sub">
        Jabatan Bedah Mulut &amp; Maksilofasial<br>
        Hospital Pasir Gudang
      </div>
      <div class="divider"></div>
    </header>

    <div class="toolbar">
      <div class="panel search">
        <div class="searchIcon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M10.5 18.5a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <input id="q" type="text" placeholder="Search apps..." autocomplete="off" aria-label="Search apps" />
        <div class="hint" id="countHint" aria-live="polite">0 apps</div>
      </div>

      <div class="toolbarActions">
        <button class="panel iconBtn btn primary" id="addBtn" type="button" aria-label="Add new app" title="Add new app">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="panel iconBtn btn" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg id="themeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none"></svg>
        </button>
        <button class="panel favBtn btn" id="favToggle" type="button" aria-pressed="false" title="Toggle favourites">
          <span class="star">★</span><span>Favourites</span><span class="pill" id="favCount">0</span>
        </button>
      </div>
    </div>

    <nav class="panel chips" id="chips" aria-label="App categories"></nav>
    
    <main class="grid" id="grid">
      <div class="empty-state" id="loadingState">
        <div class="spinner"></div>
        <h3>Loading portal...</h3>
        <p>Syncing with database</p>
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <h3>No apps found</h3>
        <p>Try adjusting your search or add a new app.</p>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="appModal">
    <div class="modal-box">
      <h2>Add New App</h2>
      <form id="addForm">
        <div class="form-group">
          <label for="appName">App Name *</label>
          <input type="text" id="appName" class="form-control" required placeholder="e.g., Staff Leave System">
        </div>
        <div class="form-group">
          <label for="appDesc">Description</label>
          <input type="text" id="appDesc" class="form-control" placeholder="Brief summary of what it does">
        </div>
        <div class="form-group">
          <label for="appUrl">Web Link (URL) *</label>
          <input type="url" id="appUrl" class="form-control" required placeholder="https://...">
        </div>
        <div class="form-group">
          <label for="appCat">Category</label>
          <input type="text" id="appCat" class="form-control" placeholder="e.g., Clinic, Registry, HR">
        </div>
        <div class="form-group">
          <label for="appTag">Tag (Small Badge)</label>
          <input type="text" id="appTag" class="form-control" placeholder="e.g., Core, KPI, Beta">
        </div>
        <div class="form-group">
          <label>Theme Color</label>
          <div class="color-picker" id="colorPicker">
            <div class="color-opt selected" style="background:#1f4fd8" data-color="#1f4fd8"></div>
            <div class="color-opt" style="background:#ad1457" data-color="#ad1457"></div>
            <div class="color-opt" style="background:#0ea5e9" data-color="#0ea5e9"></div>
            <div class="color-opt" style="background:#0f766e" data-color="#0f766e"></div>
            <div class="color-opt" style="background:#8b5cf6" data-color="#8b5cf6"></div>
            <div class="color-opt" style="background:#f59e0b" data-color="#f59e0b"></div>
            <div class="color-opt" style="background:#10b981" data-color="#10b981"></div>
            <div class="color-opt" style="background:#ef4444" data-color="#ef4444"></div>
          </div>
          <input type="hidden" id="appColor" value="#1f4fd8">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-text" id="closeModal">Cancel</button>
          <button type="submit" class="btn-submit" id="submitBtn">Save App</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /************************************************************
     * CLOUD DATABASE CONFIGURATION
     ************************************************************/
    // The exact Web App URL provided for the Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweoBwL0KBETY1Na2wuh5_zj8mjqXZkQdnC2jz-WMK1VUX8eEvkLkur_Q_JDfJqe2cc/exec"; 
    
    let APPS = []; // Will be populated from Google Sheets

    /************************************************************
     * FAVOURITES (localStorage)
     ************************************************************/
    const LS_KEY = "OMFS_PORTAL_FAVS_V1";
    function loadFavs() {
      try { const raw = localStorage.getItem(LS_KEY); const arr = raw ? JSON.parse(raw) : []; return new Set(Array.isArray(arr) ? arr : []); } 
      catch(e) { return new Set(); }
    }
    function saveFavs(set) {
      try { localStorage.setItem(LS_KEY, JSON.stringify([...set])); } catch(e) {}
    }
    const favSet = loadFavs();

    // DOM Elements
    const q = document.getElementById('q');
    const grid = document.getElementById('grid');
    const chips = document.getElementById('chips');
    const countHint = document.getElementById('countHint');
    const favToggle = document.getElementById('favToggle');
    const favCount = document.getElementById('favCount');
    const emptyState = document.getElementById('emptyState');
    const loadingState = document.getElementById('loadingState');

    let activeFilter = "All";
    let favouritesOnly = false;

    // Utility Functions
    function uniq(arr){ return [...new Set(arr)].filter(Boolean); }
    function escapeHtml(s) {
      return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    /************************************************************
     * FETCH APPS FROM GOOGLE SHEETS
     ************************************************************/
    async function fetchApps() {
      if(SCRIPT_URL === "PASTE_YOUR_COPIED_WEB_APP_URL_HERE") {
        loadingState.innerHTML = "<h3>Configuration Needed</h3><p>Please paste your Google Apps Script URL into the HTML file.</p>";
        return;
      }
      
      try {
        const response = await fetch(SCRIPT_URL);
        if(!response.ok) throw new Error("Network response was not ok");
        APPS = await response.json();
        
        // Remove loading state
        loadingState.style.display = "none";
        
        buildChips();
        buildGrid();
        apply();
      } catch (error) {
        console.error("Error fetching apps:", error);
        loadingState.innerHTML = "<h3>Connection Error</h3><p>Could not load database. Please try refreshing.</p>";
      }
    }

    /************************************************************
     * UI RENDERING
     ************************************************************/
    function buildChips() {
      const cats = uniq(APPS.map(a => {
        // Capitalize category safely
        let c = a.category || "";
        return c.charAt(0).toUpperCase() + c.slice(1);
      })).sort((a,b) => a.localeCompare(b));
      
      const items = ["All", ...cats];
      chips.innerHTML = items.map((c, idx) => {
        const active = (idx === 0 && activeFilter === "All") || (c === activeFilter) ? "active" : "";
        return `<button type="button" class="chip btn ${active}" data-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`;
      }).join("");
    }

    function buildGrid() {
      // Clean existing app cards but keep states
      Array.from(grid.children).forEach(child => {
        if(!child.classList.contains('empty-state')) child.remove();
      });

      const html = APPS.map(app => {
        const accent = app.color || "#1f4fd8";
        // Capitalize Category safely if tag is missing
        let catCap = app.category ? app.category.charAt(0).toUpperCase() + app.category.slice(1) : "App";
        const badge = app.tag || catCap;
        const isFav = favSet.has(app.id);

        return `
          <a href="${escapeHtml(app.url || "#")}" target="_blank" rel="noopener noreferrer"
             class="app btn" data-id="${escapeHtml(app.id)}" data-name="${escapeHtml(app.name)}"
             data-category="${escapeHtml(catCap)}" style="--accent:${escapeHtml(accent)}">
            <div class="top">
              <div>
                <h3>${escapeHtml(app.name || "")}</h3>
                <p>${escapeHtml(app.desc || "")}</p>
              </div>
              <span class="badge">${escapeHtml(badge)}</span>
            </div>
            <div class="openRow">
              <span class="openPill">Open</span>
              <span class="rightTools">
                <span class="dot" aria-hidden="true"></span>
                <button type="button" class="favMini btn ${isFav ? "isFav" : ""}" data-fav="1"
                        aria-label="${isFav ? 'Remove' : 'Add'} fav" title="${isFav ? 'Remove' : 'Add'} fav">
                  ${isFav ? "★" : "☆"}
                </button>
              </span>
            </div>
          </a>
        `;
      }).join("");
      
      grid.insertAdjacentHTML('afterbegin', html);
    }

    function apply() {
      const term = (q.value || "").trim().toLowerCase();
      const cards = [...grid.querySelectorAll('.app')];
      let visible = 0;

      for (const card of cards) {
        const name = (card.dataset.name || "").toLowerCase();
        const cat  = (card.dataset.category || "");
        const id   = (card.dataset.id || "");
        const isFav = favSet.has(id);

        const matchTerm = !term || name.includes(term);
        const matchFilter = activeFilter === "All" || cat === activeFilter;
        const matchFav = !favouritesOnly || isFav;

        const show = matchTerm && matchFilter && matchFav;
        card.style.display = show ? "flex" : "none";
        if (show) visible++;
      }

      countHint.textContent = visible === 1 ? "1 app" : `${visible} apps`;
      favCount.textContent = `${favSet.size}`;
      
      if(APPS.length > 0) {
        emptyState.style.display = visible === 0 ? "block" : "none";
      }
    }

    /************************************************************
     * EVENT LISTENERS
     ************************************************************/
    chips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if(!chip) return;
      activeFilter = chip.dataset.filter || "All";
      [...chips.querySelectorAll('.chip')].forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      apply();
    });

    favToggle.addEventListener('click', () => {
      favouritesOnly = !favouritesOnly;
      favToggle.setAttribute('aria-pressed', String(favouritesOnly));
      apply();
    });

    q.addEventListener('input', apply);

    grid.addEventListener('click', (e) => {
      const favBtn = e.target.closest('[data-fav="1"]');
      if (favBtn) {
        e.preventDefault(); e.stopPropagation();
        const card = e.target.closest('.app');
        if (!card) return;
        const id = card.dataset.id;
        if (!id) return;

        if (favSet.has(id)) favSet.delete(id);
        else favSet.add(id);

        saveFavs(favSet);
        const nowFav = favSet.has(id);
        favBtn.textContent = nowFav ? "★" : "☆";
        favBtn.classList.toggle("isFav", nowFav);
        apply();
      }
    });

    // Dark Mode Toggle Logic
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIconSvg = document.getElementById('themeIcon');

    function updateThemeUI() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeIconSvg.innerHTML = isDark
        ? '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' 
        : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('OMFS_THEME', 'light'); } 
      else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('OMFS_THEME', 'dark'); }
      updateThemeUI();
    });

    /************************************************************
     * MODAL & FORM LOGIC (ADD NEW APP)
     ************************************************************/
    const modal = document.getElementById('appModal');
    const addBtn = document.getElementById('addBtn');
    const closeModalBtn = document.getElementById('closeModal');
    const addForm = document.getElementById('addForm');
    const colorPicker = document.getElementById('colorPicker');
    const colorInput = document.getElementById('appColor');
    const submitBtn = document.getElementById('submitBtn');

    addBtn.addEventListener('click', () => { modal.classList.add('show'); });
    
    closeModalBtn.addEventListener('click', () => { 
      modal.classList.remove('show'); 
      addForm.reset(); 
    });
    
    // Close on outside click
    modal.addEventListener('click', (e) => {
      if(e.target === modal) { modal.classList.remove('show'); addForm.reset(); }
    });

    // Color Picker Logic
    colorPicker.addEventListener('click', (e) => {
      if(e.target.classList.contains('color-opt')) {
        [...colorPicker.children].forEach(c => c.classList.remove('selected'));
        e.target.classList.add('selected');
        colorInput.value = e.target.dataset.color;
      }
    });

    // Handle Form Submit
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if(SCRIPT_URL === "PASTE_YOUR_COPIED_WEB_APP_URL_HERE") {
        alert("Please set up the Google Apps Script URL in the code first!");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";

      const newApp = {
        name: document.getElementById('appName').value,
        desc: document.getElementById('appDesc').value,
        url: document.getElementById('appUrl').value,
        category: document.getElementById('appCat').value,
        tag: document.getElementById('appTag').value,
        color: colorInput.value
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          // Use text/plain to avoid CORS preflight issues with Google Apps Script
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(newApp)
        });
        
        const result = await response.json();
        
        if(result.status === "success") {
          modal.classList.remove('show');
          addForm.reset();
          // Reload the apps to show the new one
          loadingState.style.display = "block";
          emptyState.style.display = "none";
          grid.innerHTML = ''; 
          grid.appendChild(loadingState);
          grid.appendChild(emptyState);
          await fetchApps();
        } else {
          alert("Error saving: " + result.message);
        }
      } catch (error) {
        console.error(error);
        alert("Failed to connect to database. Check console for details.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Save App";
      }
    });

    // Start App
    updateThemeUI();
    fetchApps();
  </script>
</body>
</html>
